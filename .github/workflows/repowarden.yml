# Vérifications repowarden en CI (obligatoires pour merger : repowarden proteger)
name: repowarden

on:
  pull_request:
    # edited : revérifie quand le titre de la PR change (message du commit en squash)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  # Lancé par le workflow de release sur sa PR (release-auto)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # fix-pr : PR mal visée reciblée

jobs:
  repowarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : messages de commit, diff depuis la base
      # Outillage du projet (python) : formatage et tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Formatage, code mort et tests (versions figées)
      - run: pip install ruff==0.16.10 vulture==2.16 pytest==9.1.1
      - uses: simdevWarden/repowarden@v4
        with:
          strict: true # outillage installé ci-dessus : un outil absent fait échouer
          # Seule la branche d'intégration entre dans la principale : une PR
          # de travail mal visée est reciblée avant les vérifications
          fix-pr: "true"
